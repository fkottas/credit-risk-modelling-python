[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creditriskbook"
version = "0.1.0"
description = "Tested examples for Applied Credit Risk with Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ferdinantos Kottas"}]
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
datasets = ["openpyxl>=3.1,<4", "xlrd>=2.0.1,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
creditrisk-demo = "creditriskbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
